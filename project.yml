name: USBProxy
options:
  bundleIdPrefix: com.local.usbproxy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "" # Xcode > Settings > Accounts 또는 xcodebuild DEVELOPMENT_TEAM=... 지정
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    APP_BUNDLE_ID: com.local.usbproxy
    APP_GROUP_ID: group.com.local.usbproxy
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  # 메인 앱 + 2단계 Packet Tunnel 확장 포함 (유료 Apple 개발자 계정용)
  USBProxy:
    type: application
    platform: iOS
    sources:
      - path: ios/ProxyCore
      - path: ios/App
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - target: USBProxyTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ios/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/App/USBProxy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PACKET_TUNNEL_ENABLED"

  # 2단계: Packet Tunnel 확장 타깃 (더미 터널로 백그라운드 유지, 50MB 메모리 제한 대응)
  USBProxyTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/ProxyCore
      - path: ios/TunnelExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tunnel
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ios/TunnelExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/TunnelExtension/TunnelExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  # 무료 Apple ID / SideStore / AltStore용 (tether 방식 무음 오디오 백그라운드 유지, VPN 확장 제외)
  USBProxyFree:
    type: application
    platform: iOS
    sources:
      - path: ios/ProxyCore
      - path: ios/App
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ios/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/App/USBProxy-Free.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  USBProxy:
    build:
      targets:
        USBProxy: all
        USBProxyTunnel: all
    run:
      config: Debug
    archive:
      config: Release
  USBProxyFree:
    build:
      targets:
        USBProxyFree: all
    run:
      config: Debug
    archive:
      config: Release
